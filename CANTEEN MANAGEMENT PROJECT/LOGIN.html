<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Canteen Management System</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>

    <div class="login-container">

        <h1>CANTEEN MANAGEMENT SYSTEM</h1>

        <h2>LOGIN</h2>


        <!-- Role -->

        <label for="loginRole">
            Select Role
        </label>

        <select id="loginRole">

            <option value="">
                Select Role
            </option>

            <option value="student">
                Student
            </option>

            <option value="staff">
                Canteen Staff
            </option>

        </select>


        <!-- Username -->

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >


        <!-- Password -->

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >


        <!-- Login -->

        <button id="loginBtn">
            LOGIN
        </button>


        <!-- Back -->

        <a href="INDEX.html">
            ← Back to Home
        </a>

    </div>


    <script src="login.js"></script>

</body>

</html>
