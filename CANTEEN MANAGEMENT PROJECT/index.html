<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Canteen Management System</title>

    <link rel="stylesheet" href="INDEX.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h1>CANTEEN MANAGEMENT SYSTEM</h1>

        <div class="controls">

            <!-- Language -->
            <select id="languageSelect">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="gu">Gujarati</option>
            </select>

            <!-- Dark Mode -->
            <button id="darkModeBtn">
                🌙 Dark Mode
            </button>

            <!-- Login -->
            <a href="login.html" class="login-btn">
                LOGIN
            </a>

        </div>

    </header>


    <!-- Main -->
    <main>

        <!-- Image -->
        <section class="canteen-image">

        </section>


        <!-- Portal Selection -->
        <section class="portal-selection">

            <h2 id="selectPortal">
                SELECT YOUR PORTAL
            </h2>

            <p id="roleText">
                Please select your role:
            </p>


            <!-- Student -->
            <label class="role-option">

                <input
                    type="radio"
                    name="role"
                    value="student"
                >

                <span id="studentText">
                    🎓 STUDENT
                </span>

            </label>


            <!-- Staff -->
            <label class="role-option">

                <input
                    type="radio"
                    name="role"
                    value="staff"
                >

                <span id="staffText">
                    👨‍🍳 CANTEEN STAFF
                </span>

            </label>


            <br>

            <button id="continueBtn">
                CONTINUE
            </button>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p id="footerText">
            © 2026 Canteen Management System
        </p>

    </footer>


    <script src="index.js"></script>

</body>

</html>
